<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavBar à Direita</title>
    <style>
        body {
            margin: 0;
            display: flex;
        }
        .navbar {
            width: 250px;
            background-color: #333;
            color: white;
            padding: 20px;
            position: fixed;
            right: 0;
            top: 0;
        }
        .content {
            flex-grow: 1;
            margin-right: 250px;
            padding: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
        }
        a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <a href="main.html">Voltar</a>
    <div class="navbar">
        <h2>Menu</h2>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Serviços</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </div>
    <div class="content">
        <h1>Bem-vindo ao site!</h1>
        <p>Este é um exemplo de barra de navegação fixa à direita.</p>
    </div>
</body>
</html>
